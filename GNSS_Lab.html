function theory(){const txt=[['Serbest uzay ve 290 K gürültü modeli. Anten kazançları sabittir; arazi ve hava koşulları modellenmez. Hassasiyet bir kullanıcı eşiğidir.','Free-space, 290 K model. Antenna gains are fixed; terrain and weather are not modeled. Sensitivity is a user-defined threshold.'],['Öğretici DLL; ideal taşıyıcı giderimi, sabit veri işareti, ζ=0,707. Acquisition ve PLL/FLL uygulanmaz. Hızlı modda üçgen ACF ve korelasyonlu kompleks gürültü; örnekli modda PRN 1 için 4,092 MHz temel bant ve doğrusal kesirli gecikme kullanılır. Kilit göstergesi öğretici bir eşiktir. 1 ms kod fazı tek başına tam mesafeyi vermez. Entegrasyon bit sınırını geçmiyor varsayılır.','Educational DLL; ideal carrier wipe-off, constant data sign, ζ=0.707. Acquisition and PLL/FLL are not implemented. Fast mode uses a triangular ACF with correlated complex noise; sampled mode uses PRN 1 at 4.092 MHz and linear fractional delay. Lock status is an educational threshold. Code phase within 1 ms alone does not give full range. Integration is assumed not to cross a data-bit boundary.'],['Kod ve faz modellerinde donanım ve çoklu yol burada sıfırdır. Gösterilen faz, metre cinsindedir. N bilinmeyen başlangıç çevrim sayısını temsil eder; bu bir RTK çözümü değildir. Gürültü sabit tohumlu sentetik Gauss dağılımıdır.','Hardware and multipath biases are zero in this module. Phase is displayed in metres. N represents the initial integer ambiguity; this is not an RTK solution. Noise is seeded synthetic Gaussian noise.'],['I=40,3·STEC/f²; STEC slant elektron içeriğidir. T=Tz/sin(E) yalnızca basit eğitim modelidir ve E≥10° kullanılır. Yörünge terimi görüş doğrultusuna izdüşümdür. Buradaki çoklu yol ayarlanabilir ölçüm biasıdır; sinyal yansıması Kod takibi sekmesindedir. SA Mayıs 2000’de kapatılmıştır; bu örnek sentetiktir.','I=40.3·STEC/f²; STEC is slant electron content. T=Tz/sin(E) is a simple educational model with E≥10°. Orbit error is its line-of-sight projection. Here multipath is an adjustable range bias; signal reflections are in Code tracking. SA was disabled in May 2000; this example is synthetic.'],['Düzeltme oranı α bütün modellenen etkiler için aynı seçilen eğitim parametresidir. Alıcı saat sapması düzeltme akışında çıkarılmaz; konum çözümünde tahmin edilmelidir. Çoklu yol ve SA kalır. Saat polinomu kavramı: δts=a₀+a₁(t−t₀)+a₂(t−t₀)². Burada doğrudan δts ayarlanır.','Correction fraction α is a common educational model parameter. Receiver clock bias is not removed in this flow; it must be estimated in positioning. Multipath and SA remain. Clock polynomial concept: δts=a₀+a₁(t−t₀)+a₂(t−t₀)². Here δts is adjusted directly.'],['Uydular sentetiktir; gerçek efemeris veya canlı veri kullanılmaz. Referans WGS84 konumu 40,95° N, 29,15° E, elipsoidal yükseklik 50 m. Çözücü farklı bir başlangıç konumundan QR ile iteratif en küçük kareler uygular. Dünya dönüşü, relativistik etkiler ve yörünge hareketi bu sabit an deneyinde kapsam dışıdır. Kod takibinden bağlanan hata yalnızca ilk uyduya eklenir.','Satellites are synthetic, with no broadcast ephemeris or live data. WGS84 reference: 40.95° N, 29.15° E, ellipsoidal height 50 m. The solver starts elsewhere and uses iterative QR least squares. Earth rotation, relativity and orbit motion are outside this snapshot model. Linked code tracking error is applied only to the first satellite.'],['UERE yalnızca bağımsız, sıfır ortalamalı standart sapmaların RSS toplamıdır. Q=(GᵀG)⁻¹; geometri Konum sekmesinden gelir. 2DRMS evrensel %95 yarıçap değildir. Monte Carlo yalnızca geometriyi paylaşır; Konum sekmesindeki biaslar eklenmez. 200 bağımsız ölçüm setini yeniden çözer; doğrusal kovaryansın elipsi %95 Gauss öngörüsüdür, gerçek örneklerin yüzdeliği ayrıca hesaplanır.','UERE is the RSS of independent zero-mean standard deviations. Q=(GᵀG)⁻¹; geometry is shared with Position. 2DRMS is not a universal 95% radius. Monte Carlo shares geometry only and does not include biases from Position. It solves 200 independent measurement sets; the covariance ellipse is a Gaussian 95% prediction, while empirical percentiles are computed separately.']];return `<details><summary>${tr('Kısa teori, varsayımlar ve kaynaklar','Brief theory, assumptions & sources')}</summary><p>${txt[tab][lang==='tr'?0:1]}</p><a href="https://gssc.esa.int/navipedia/index.php/GNSS_Basic_Observables" target="_blank" rel="noopener">ESA · Observables</a><a href="https://gssc.esa.int/navipedia/index.php/Delay_Lock_Loop_(DLL)" target="_blank" rel="noopener">ESA · DLL</a><a href="https://gssc.esa.int/navipedia/index.php/Positioning_Error" target="_blank" rel="noopener">ESA · DOP</a><a href="https://www.itu.int/rec/R-REC-P.525/en" target="_blank" rel="noopener">ITU · FSPL</a></details><div class="footerline"><span>GNSS LAB / 2026</span><span>${tr('EĞİTİM SİMÜLATÖRÜ · TEK DOSYA','EDUCATIONAL SIMULATOR · SINGLE FILE')}</span></div>`}

function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=+b.dataset.tab;render()});document.querySelectorAll('[data-key]').forEach(el=>{el.addEventListener('input',()=>setValue(el.dataset.key,el.value,el));el.addEventListener('change',()=>{el.value=S[el.dataset.key]})});document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{S[el.dataset.check]=el.checked;update()});$('reset').onclick=()=>{let keys=[...document.querySelectorAll('#controls [data-key]')].map(x=>x.dataset.key);keys.forEach(k=>S[k]=defaults[k]);if(tab===1){S.rfLink=false;S.trackNoise=true;S.trackModel=0;resetTrack()}if(tab===5)disabled.clear();mcResult=null;render()};if($('play'))$('play').onclick=()=>{running=!running;$('play').textContent=running?tr('Ⅱ Duraklat','Ⅱ Pause'):tr('▶ Devam','▶ Resume')};if($('step'))$('step').onclick=()=>{running=false;$('play').textContent=tr('▶ Devam','▶ Resume');trackStep();updateTrack()};if($('restart'))$('restart').onclick=()=>{resetTrack();updateTrack()};if($('trackmodel'))$('trackmodel').onchange=e=>{S.trackModel=+e.target.value;resetTrack();updateTrack()};if($('sendrf'))$('sendrf').onclick=()=>{S.rfLink=true;tab=1;render()};if($('slip'))$('slip').onclick=()=>setValue('integer',Math.min(100,S.integer+1));}

function rf(){const fs=20*Math.log10(4*Math.PI*S.dist*1000*S.rfF*1e6/C),pr=S.pt+S.gt+S.gr-fs-S.loss,n0=-174+S.nf,cn=pr-n0;return {fs,pr,n0,cn,snr:cn-10*Math.log10(S.bw*1e6)}}
function physics(){const i=40.3*S.tec*1e16/L1**2,t=S.zen/Math.sin(S.elev*RAD),clk=C*(S.clock-S.satclock)*1e-9,orbit=S.orbit;return {i,t,clk,code:clk+i+t,phase:clk-i+t+C/L1*S.integer,total:clk+i+t+orbit+S.hardware+S.mp+S.sa}}
